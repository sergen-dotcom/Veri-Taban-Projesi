spring.application.name=Data_base_project
server.port=${SERVER_PORT:8080}

# .env Dosyasını Otomatik İçe Aktarma
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Istanbul&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:hakanaydin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
